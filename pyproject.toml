[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sphere-mesh-lab"
version = "0.1.0"
description = "Olight Sphere C Bluetooth Mesh research and local control"
requires-python = ">=3.12"
dependencies = [
    "btmesh[harness] @ git+https://github.com/dasimon135/ha-bluetooth-mesh.git@a8f7bbbebaeba124d7d08cb16122055074f2ef46",
    "cryptography>=42",
    "dbus-fast>=5",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8,<7",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
sphere-mesh = "sphere_mesh.provision:main"
sphere-capture = "sphere_mesh.capture:main"
sphere-meshctl = "sphere_mesh.client:main"
sphere-meshd = "sphere_mesh.daemon:main"
sphere-mesh-service = "sphere_mesh.user_service:main"
sphere-mesh-gui = "sphere_mesh.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sphere_mesh.gui" = ["qml/*.qml", "qml/**/*.qml", "qml/shaders/*.frag", "qml/shaders/*.qsb", "assets/*", "assets/**/*"]

[tool.setuptools.data-files]
"share/applications" = ["packaging/desktop/sphere-mesh-gui.desktop"]
"share/icons/hicolor/scalable/apps" = ["packaging/desktop/sphere-mesh-gui.svg"]
"share/doc/sphere-mesh-lab" = ["packaging/desktop/ASSETS.md"]
"share/sphere-mesh/systemd" = [
    "packaging/systemd/sphere-mesh.service",
    "packaging/systemd/proxy.toml",
    "packaging/systemd/mesh.toml",
    "packaging/systemd/split.toml",
    "packaging/systemd/sphere-mesh-controller",
    "scripts/install_mesh_controller.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
