[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spherosphere"
version = "0.2.1"
description = "Spherosphere: local Bluetooth Mesh control of Olight Sphere C lights"
requires-python = ">=3.12"
dependencies = [
    "btmesh[harness] @ git+https://github.com/dasimon135/ha-bluetooth-mesh.git@a8f7bbbebaeba124d7d08cb16122055074f2ef46",
    "cryptography>=42",
    "dbus-fast>=5",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8,<7",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
spherosphere-provision = "spherosphere.provision:main"
spherosphere-capture = "spherosphere.capture:main"
spherospherectl = "spherosphere.client:main"
spherosphered = "spherosphere.daemon:main"
spherosphere-service = "spherosphere.user_service:main"
spherosphere = "spherosphere.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spherosphere.gui" = ["qml/*.qml", "qml/**/*.qml", "qml/shaders/*.frag", "qml/shaders/*.qsb", "assets/*", "assets/**/*"]

[tool.setuptools.data-files]
"share/applications" = ["packaging/desktop/spherosphere.desktop"]
"share/icons/hicolor/scalable/apps" = ["packaging/desktop/spherosphere.svg"]
"share/doc/spherosphere" = ["packaging/desktop/ASSETS.md"]
"share/spherosphere/systemd" = [
    "packaging/systemd/spherosphere.service",
    "packaging/systemd/proxy.toml",
    "packaging/systemd/mesh.toml",
    "packaging/systemd/split.toml",
    "packaging/systemd/spherosphere-controller",
    "scripts/install_mesh_controller.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
